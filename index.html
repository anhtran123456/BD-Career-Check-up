<!doctype html>

:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>BD Career Check-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centered "app card" column (max 640px); a slim 3-stage track on top; one question per screen in stage 1, one screen each for stages 2 and 3; result = stacked report blocks. */
:root{
  --purple:#551CAF;      /* Upzi deep purple */
  --violet:#9345FF;      /* Upzi bright violet */
  --lime:#E0E722;        /* Upzi lime */
  --green:#89BF00;       /* Upzi green */
  --bg:#F6F3FC;          /* violet-tinted neutral */
  --surface:#FFFFFF;
  --ink:#1D1530;
  --muted:#635A78;
  --line:#E3DCF1;
  --chip:#EFE8FB;
  --on-purple:#FFFFFF;
  --on-lime:#1D1530;
  --font-display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130D20;--surface:#1E1631;--ink:#F3EEFF;--muted:#B3A7CF;--line:#33284B;--chip:#2A2042;
  --purple:#6B2FD0;--violet:#A866FF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130D20;--surface:#1E1631;--ink:#F3EEFF;--muted:#B3A7CF;--line:#33284B;--chip:#2A2042;
  --purple:#6B2FD0;--violet:#A866FF;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* top bar */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo img{height:40px;width:auto;display:block}
.logo .logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .logo-light{display:none}:root:not([data-theme="light"]) .logo .logo-dark{display:block}}
:root[data-theme="dark"] .logo .logo-light{display:none}
:root[data-theme="dark"] .logo .logo-dark{display:block}
/* mascot Gấu sits on a lime disc so the violet bear reads against the deep-purple cards */
.gau{width:132px;height:132px;flex:none;border-radius:50%;background:var(--lime);display:grid;place-items:center;overflow:hidden}
.gau img{width:86%;height:auto;transform:translateY(4%)}
.hero-top{display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero-top>div:first-child{min-width:0;display:flex;flex-direction:column;gap:10px}
@media (max-width:460px){.gau{width:92px;height:92px}}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* stage track */
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stage{display:flex;flex-direction:column;gap:6px;min-width:0}
.stage .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.stage .bar i{display:block;height:100%;width:0;background:var(--violet);transition:width .3s}
.stage span{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.on span{color:var(--ink)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.lead{color:var(--muted)}

/* intro */
.hero{background:var(--purple);color:var(--on-purple);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(30px,7vw,44px);line-height:1.05;font-weight:800}
.hero h1 mark{background:var(--lime);color:var(--on-lime);padding:0 .15em;border-radius:6px}
.hero p{opacity:.92;max-width:52ch}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step .n{width:36px;height:36px;border-radius:12px;background:var(--chip);color:var(--violet);font-family:var(--font-display);font-weight:800;display:grid;place-items:center}
.step b{display:block}
.step small{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:700;background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px}
.note{font-size:13px;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:16px;background:var(--lime);color:var(--on-lime);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--violet);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:8px 0}

/* stage 1 options */
.qcount{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qtitle{font-size:clamp(21px,5vw,26px);line-height:1.2;font-weight:700}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--violet)}
.opt.sel{border-color:var(--violet);background:var(--chip)}

/* stage 2 */
.skill{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.skill:last-child{border-bottom:0;padding-bottom:0}
.skill h3{font-size:17px;font-weight:700}
.skill .stat{font-size:12px;font-weight:700;color:var(--green)}
.skill p{color:var(--muted);font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button,.tri button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;font-weight:800;font-variant-numeric:tabular-nums}
.scale button.sel,.tri button.sel{background:var(--violet);border-color:var(--violet);color:#fff}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri button{font-size:13px;padding:10px 4px}
.subhead{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px}

/* stage 3 */
.prio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:460px){.prio{grid-template-columns:1fr}}
.prio button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.prio button .k{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.prio button.sel{border-color:var(--violet);background:var(--chip)}
.prio button.sel .k{background:var(--violet);border-color:var(--violet);color:#fff}

/* result */
.persona{background:var(--purple);color:var(--on-purple);border-radius:24px;padding:26px 24px;display:flex;flex-direction:column;gap:12px}
.persona .eyebrow{color:var(--lime)}
.persona h2{font-size:clamp(32px,8vw,46px);line-height:1;font-weight:800}
.persona .en{font-family:var(--font-display);font-weight:700;color:var(--lime);font-size:18px}
.persona p{opacity:.94}
.mix{display:grid;gap:6px}
.mix .r{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.mix .t{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.mix .t i{display:block;height:100%;background:var(--lime)}
.mix .v{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;gap:12px}
.kv div{display:grid;gap:2px}
.kv dt{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:420px){.score{grid-template-columns:1fr}}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--font-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.level{display:inline-block;font-weight:800;font-size:13px;border-radius:99px;padding:5px 12px;background:var(--lime);color:var(--on-lime)}
.levels{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
.gap{display:grid;gap:6px;padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.gap b{font-size:15px}
.gap p{font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px}
.check li::before{content:"";width:18px;height:18px;margin-top:3px;border:2px solid var(--violet);border-radius:6px}
.check li small{display:block;color:var(--muted);font-size:13px}
.decoder{display:grid;gap:8px}
.decoder div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.decoder div:first-child{border-top:0}
.decoder q{font-weight:700;quotes:"“" "”"}
@media (max-width:460px){.decoder div{grid-template-columns:1fr;gap:2px}}
.next{display:grid;gap:10px}
.next a{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.next a:hover{border-color:var(--violet)}
.next a small{display:block;color:var(--muted);font-size:13px}
.next a .arrow{font-weight:800;color:var(--violet)}
.src{font-size:12px;color:var(--muted)}
.toast{font-size:13px;font-weight:700;color:var(--green)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: scope note, top traits, app hand-off, sources */
.scope{display:grid;gap:4px;padding:14px 16px;border-radius:14px;background:var(--chip);font-size:14px}
.scope b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--violet)}
.traits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:460px){.traits{grid-template-columns:1fr}}
.trait{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--violet)}
.trait b{font-family:var(--font-display);font-size:17px}
.trait small{color:var(--muted);font-size:12px;font-weight:700}
.handoff{background:var(--lime);color:var(--on-lime);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
.handoff .eyebrow{color:var(--on-lime)}
.handoff h2{font-size:clamp(24px,6vw,32px);line-height:1.1;font-weight:800}
.handoff .btn{background:var(--purple);color:#fff;text-decoration:none;text-align:center;align-self:flex-start}
@media (max-width:460px){.handoff .btn{align-self:stretch}}
.sources{display:grid;gap:8px;font-size:12px;color:var(--muted);padding:4px 2px}
.sources b{color:var(--ink);font-size:13px}
.sources ol{margin:0;padding-left:18px;display:grid;gap:4px}
.sources a{color:var(--violet)}
.persona .roles{font-size:14px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.persona .roles b{color:var(--lime)}

/* v3: quotes, picks, fine print */
.persona .fine{font-size:12px;opacity:.75}
.gaplist{display:grid;gap:8px}
.quotes{display:grid;gap:10px}
blockquote{margin:0;padding:12px 16px;border-left:4px solid var(--violet);background:var(--bg);border-radius:0 12px 12px 0;font-size:15px;line-height:1.55}
.picks{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--chip)}
.pick span{font-weight:700;min-width:0}
.pick b{font-family:var(--font-display);font-size:22px;color:var(--violet);font-variant-numeric:tabular-nums}
.check li span{min-width:0}
.savebox .row .btn{flex:0 1 auto}
.pdfmsg{font-size:14px;font-weight:700;color:var(--muted);margin:0}
/* Offscreen A4 sheet used only to render the PDF: always light, fixed print colors */
.pdf-sheet{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#1D1530;font-family:var(--font-body);font-size:15px;line-height:1.55}
.pdf-sheet .blk{padding:12px 28px;background:#fff}
.pdf-sheet h1,.pdf-sheet h2,.pdf-sheet h3{font-family:var(--font-display);margin:0;color:#1D1530}
.pdf-sheet .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid #E3DCF1;padding-bottom:14px}
.pdf-sheet .ph img{height:42px;width:auto}
.pdf-sheet .ph small{display:block;color:#635A78;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:right}
.pdf-sheet .title{font-size:30px;font-weight:800;margin-top:14px}
.pdf-sheet .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#9345FF;margin-bottom:6px}
.pdf-sheet .card{background:#551CAF;color:#fff;border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:1fr 120px;gap:16px;align-items:center}
.pdf-sheet .card .lbl{color:#E0E722}
.pdf-sheet .card h2{color:#fff;font-size:34px;font-weight:800;line-height:1.05}
.pdf-sheet .card .en{color:#E0E722;font-weight:700;margin:6px 0}
.pdf-sheet .card p{margin:6px 0 0}
.pdf-sheet .card .fine{font-size:11px;opacity:.8}
.pdf-sheet .disc{width:120px;height:120px;border-radius:50%;background:#E0E722;display:grid;place-items:center;overflow:hidden}
.pdf-sheet .disc img{width:86%;height:auto}
.pdf-sheet h3{font-size:19px;font-weight:700;margin:0 0 8px}
.pdf-sheet .item{background:#F6F3FC;border:1px solid #E3DCF1;border-radius:12px;padding:10px 14px;margin:6px 0}
.pdf-sheet .item small{display:block;color:#635A78}
.pdf-sheet .pick{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#EFE8FB;border-radius:12px;padding:10px 14px;margin:6px 0;font-weight:700}
.pdf-sheet .pick b{font-family:var(--font-display);font-size:20px;color:#9345FF}
.pdf-sheet blockquote{margin:8px 0;padding:10px 14px;border-left:4px solid #9345FF;background:#F6F3FC;border-radius:0 10px 10px 0;font-size:14px}
.pdf-sheet .src{font-size:11px;color:#635A78;margin-top:4px}
.pdf-sheet .cta{background:#E0E722;border-radius:18px;padding:18px 22px}
.pdf-sheet .cta b{font-family:var(--font-display);font-size:20px;display:block;margin-bottom:4px}
.pdf-sheet .cta .url{font-weight:800;color:#551CAF;margin-top:8px}
.pdf-sheet ol{margin:6px 0 0;padding-left:18px;font-size:11px;color:#635A78}
.pdf-sheet ol li{margin:3px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="logo"><img class="logo-light" src="upzi-logo.png" alt="Upzi – Empowered by VietnamWorks" width="900" height="213"><img class="logo-dark" src="upzi-logo-dark.png" alt="Upzi – Empowered by VietnamWorks" width="900" height="213"></div>
    <div class="tag">AIESEC · Heading for the Future</div>
  </header>

  <nav class="track" aria-label="Tiến độ" id="track">
    <div class="stage" data-s="1"><div class="bar"><i></i></div><span>1 · Tố chất</span></div>
    <div class="stage" data-s="2"><div class="bar"><i></i></div><span>2 · Kỹ năng</span></div>
    <div class="stage" data-s="3"><div class="bar"><i></i></div><span>3 · Ưu tiên</span></div>
  </nav>

  <main id="app" aria-live="polite"></main>
</div>

<script>
const UPZI = "https://www.upzi.vn/tai-ung-dung?utm_source=NGO&utm_campaign=AIESEC_FHN_NEU";
const ONET = "https://www.onetonline.org/link/details/41-4012.00";
const CCBY = "https://creativecommons.org/licenses/by/4.0/";

/* Bước 1 – O*NET OnLine 41-4012.00, Work Styles. Câu tự đánh giá = định nghĩa O*NET, Upzi dịch sang ngôi thứ nhất.
   persona = tên gọi do Upzi đặt. w = điểm Impact của O*NET, chỉ dùng để phân định khi bằng điểm. */
const TRAITS = [
  {id:"social",t:"Định hướng xã hội",en:"Social Orientation",w:94,persona:"Người Kết nối",
   me:"Mình hay tìm đến, thích thú và được tiếp thêm năng lượng khi tương tác với mọi người trong công việc.",
   you:"Bạn có xu hướng tìm đến, tận hưởng và được tiếp thêm năng lượng từ việc tương tác với mọi người trong công việc."},
  {id:"conf",t:"Tự tin",en:"Self-Confidence",w:80,persona:"Người Tiên phong",
   me:"Mình tin vào năng lực làm việc của mình và tin mình kiểm soát được kết quả công việc.",
   you:"Bạn có xu hướng tin vào năng lực làm việc của mình và tin rằng mình kiểm soát được kết quả công việc."},
  {id:"achieve",t:"Định hướng thành tích",en:"Achievement Orientation",w:77,persona:"Người Chinh phục",
   me:"Mình đặt ra và theo đuổi những mục tiêu công việc mang tính thử thách với bản thân, đặt tiêu chuẩn cao và nỗ lực hết sức để đạt được.",
   you:"Bạn có xu hướng đặt ra và theo đuổi những mục tiêu công việc mang tính thử thách với chính mình, đặt tiêu chuẩn cao và nỗ lực hết sức để đạt được."},
  {id:"opt",t:"Lạc quan",en:"Optimism",w:70,persona:"Người Truyền lửa",
   me:"Mình giữ được thái độ và cảm xúc tích cực trong công việc, kể cả khi gặp hoàn cảnh khó khăn.",
   you:"Bạn có xu hướng giữ thái độ và cảm xúc tích cực trong công việc, kể cả khi gặp hoàn cảnh khó khăn."},
  {id:"dep",t:"Đáng tin cậy",en:"Dependability",w:69,persona:"Người Giữ chữ tín",
   me:"Mình đáng tin, có trách nhiệm và nhất quán trong việc hoàn thành những nghĩa vụ công việc.",

function setTrack(){
  const fill={1:0,2:0,3:0};
  if(S.screen==="traits") fill[1]=Object.keys(S.traits).length/TRAITS.length*100;
  if(["skills","prio","result"].includes(S.screen)) fill[1]=100;
  if(S.screen==="skills") fill[2]=(Object.keys(S.skills).length+Object.keys(S.prof).length)/(SKILLS.length+PROFILE.length)*100;
  if(["prio","result"].includes(S.screen)) fill[2]=100;
  if(S.screen==="prio") fill[3]=S.picks.length/3*100;
  if(S.screen==="result") fill[3]=100;
  const cur={intro:0,traits:1,skills:2,prio:3,result:4}[S.screen];
  document.querySelectorAll(".stage").forEach(el=>{const s=+el.dataset.s;el.querySelector("i").style.width=fill[s]+"%";el.classList.toggle("on",s<=cur);});
  document.getElementById("track").hidden=S.screen==="intro";
}
function go(screen){ S.screen=screen; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function keepScroll(fn){ const y=window.scrollY; setTrack(); fn(); window.scrollTo(0,y); }
function render(){ setTrack(); ({intro:rIntro,traits:rTraits,skills:rSkills,prio:rPrio,result:rResult})[S.screen](); }

function compute(){
  const tr=TRAITS.map(t=>({...t,r:S.traits[t.id]})).sort((a,b)=>b.r-a.r||b.w-a.w);
  const sk=SKILLS.map(s=>({...s,r:S.skills[s.id]})).sort((a,b)=>a.r-b.r);
  const lowSkills=sk.filter(s=>s.r<=3).slice(0,2);
  const todo=PROFILE.filter(p=>S.prof[p.id]<2);
  const picks=S.picks.map(id=>FACTORS.find(f=>f.id===id));
  return {top:tr[0],next:tr.slice(1,3),lowSkills,todo,picks};
}

async function saveBlob(blob,name){
  if(window.claude && typeof window.claude.use==="function"){
    const dl=await window.claude.use("downloads");
    if(!dl) throw {code:"unavailable"};
    return dl.save({filename:name,data:blob});
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
  return {status:"saved"};
}

async function downloadPdf(R){
  const btn=document.getElementById("pdf"), msg=document.getElementById("pdfmsg");
  const say=t=>{msg.textContent=t;msg.hidden=false;};
  btn.disabled=true; say("Đang tạo file PDF, bạn chờ vài giây nhé…");
  let sheet=null;
  try{
    await loadLibs();
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    sheet=buildSheet(R); document.body.appendChild(sheet);
    await Promise.all([...sheet.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
    const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"pt",format:"a4"});
    const W=pdf.internal.pageSize.getWidth(), H=pdf.internal.pageSize.getHeight(), M=24, cw=W-2*M; let y=M;
    for(const blk of sheet.querySelectorAll(".blk")){
      const c=await window.html2canvas(blk,{scale:2,backgroundColor:"#ffffff",logging:false});
      const h=c.height*cw/c.width;
      if(y+h>H-M && y>M){ pdf.addPage(); y=M; }
      pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",M,y,cw,h);
      if(blk.dataset.link) pdf.link(M,y,cw,h,{url:blk.dataset.link});
      y+=h;
    }
    sheet.remove(); sheet=null;
    await saveBlob(pdf.output("blob"),"BD-Career-Check-up-Upzi.pdf");
    say("Đã tải xong file PDF.");
  }catch(e){
    const code=e&&e.code;
    say(code==="declined"?"Bạn đã hủy tải xuống."
      :code==="rate_limited"?"Đang có một yêu cầu tải khác, bạn thử lại sau vài giây nhé."
      :code==="lib"?"Chưa tải được công cụ tạo PDF. Bạn kiểm tra kết nối mạng rồi thử lại nhé."
      :"Trình xem này chưa cho phép tải file. Bạn mở trang trên trình duyệt, hoặc dùng nút Sao chép kết quả nhé.");
  }finally{ if(sheet) sheet.remove(); btn.disabled=false; }
}

function fallback(txt,t){
  const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.cssText="width:100%;min-height:120px;margin-top:8px";
  t.parentElement.after(ta);ta.select();t.textContent="Chọn và sao chép đoạn bên dưới";t.hidden=false;
}
